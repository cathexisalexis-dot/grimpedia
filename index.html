<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grim-Pedia | Gothic Photo Album</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050202;
            --surface-color: #120808;
            --surface-hover: #1c0e0e;
            --border-color: #3f1515;
            --border-glow: #dc2626;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-red: #ef4444;
            --accent-dark-red: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Crimson Text', serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Gothic Vignette & Fog Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.85) 90%),
                        linear-gradient(to bottom, rgba(153, 27, 27, 0.05), transparent);
            pointer-events: none;
            z-index: 100;
        }

        header {
            text-align: center;
            padding: 4rem 1rem 3rem;
            position: relative;
            border-bottom: 2px solid var(--border-color);
            background: linear-gradient(to bottom, #150505, var(--bg-color));
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 3.5rem;
            color: var(--accent-red);
            text-shadow: 0 0 15px rgba(239, 68, 68, 0.5), 0 0 30px rgba(153, 27, 27, 0.3);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1400px;
            margin: 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .photo-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-glow);
            box-shadow: 0 5px 20px rgba(153, 27, 27, 0.3);
        }

        .photo-frame {
            width: 100%;
            height: 250px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover .photo-frame img {
            transform: scale(1.05);
        }

        .photo-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--accent-red);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.6rem;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            z-index: 2;
        }

        .photo-info {
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .photo-title {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--accent-red);
            margin-bottom: 0.5rem;
        }

        .photo-caption {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Modal Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 2, 2, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface-color);
            border: 1px solid var(--border-glow);
            max-width: 800px;
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(220, 38, 38, 0.4);
            position: relative;
            animation: modalFade 0.3s ease;
        }

        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 1rem 1.5rem;
            background: #1a0808;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'Cinzel', serif;
            color: var(--accent-red);
            font-size: 1.3rem;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .modal-img {
            max-height: 500px;
            max-width: 100%;
            object-fit: contain;
            border: 1px solid var(--border-color);
        }

        .modal-caption-text {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-main);
            line-height: 1.6;
        }

        footer {
            text-align: center;
            padding: 3rem;
            border-top: 2px solid var(--border-color);
            font-family: 'Cinzel', serif;
            color: var(--text-muted);
            font-size: 0.9rem;
            letter-spacing: 2px;
            background: var(--surface-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Grim-Pedia</h1>
        <div class="subtitle">Grim's Adventures and Happy Times!</div>
    </header>

    <main class="gallery-container" id="galleryGrid">
        <!-- Photos will be populated via JavaScript -->
    </main>

    <!-- Modal View -->
    <div class="modal" id="photoModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Relic</div>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <div class="modal-body">
                <img class="modal-img" id="modalImg" src="" alt="Expanded Relic">
                <div class="modal-caption-text" id="modalCaption"></div>
            </div>
        </div>
    </div>

    <footer>
        &copy; Grim-Pedia. All shadows reserved.
    </footer>

    <script>
        const photos = [
            {
                id: 1,
                title: "Cow Encounter Close-Up",
                caption: "Just a casual bovine interrogation—Grim is strictly here for the philosophical debates, honestly.",
                url: "https://i.imgur.com/xLUwaDs.png"
            },
            {
                id: 2,
                title: "Starlit Woods Encounter",
                caption: "When you're trying to have a serious moment under the stars, but gravity and posture decide to do their own interpretive dance.",
                url: "https://i.imgur.com/IU4Z3Gh.png"
            },
            {
                id: 3,
                title: "Pole Routine (Portrait View)",
                caption: "Channeling pure celestial energy, one starry ceiling and vertical metal rod at a time.",
                url: "https://i.imgur.com/t1iR5fT.png"
            },
            {
                id: 4,
                title: "Pole Routine (Close-Up)",
                caption: "Practicing proper posture and upper-body strength for when the alien mothership calls.",
                url: "https://i.imgur.com/g8F20hJ.png"
            },
            {
                id: 5,
                title: "Action Jet Dogfight",
                caption: "Who needs an airplane when you can just breathe a rainbow laser beam and handle the entire air force solo?",
                url: "https://i.imgur.com/ERrFVFp.png"
            },
            {
                id: 6,
                title: "Gamodon Pokémon Card",
                caption: "Say hello to Gamodon—the rare Rock/Electric type whose special ability is acing every video game while looking impeccably chiselled.",
                url: "https://i.imgur.com/H9tqjRi.png"
            },
            {
                id: 7,
                title: "Grimeos Cookie Pack",
                caption: "The snack that bites back: introducing Grimeos, the official crunchy collaboration of your dreams.",
                url: "https://i.imgur.com/vcUQkGx.png"
            },
            {
                id: 8,
                title: "Waterfall Retreat Mirror Check",
                caption: "Checking for side quests and scenic waterfalls at the ultimate virtual getaway.",
                url: "https://i.imgur.com/5QfSUKH.png"
            },
            {
                id: 9,
                title: "Cow Tail Chasing",
                caption: "Proof that extreme wakeboarding doesn't actually require water—just one very cooperative (and fast) farm animal.",
                url: "https://i.imgur.com/1GR1AoT.png"
            },
            {
                id: 10,
                title: "Neon Stage Posture",
                caption: "Striking a dramatic pose under the neon glow because every good virtual hangout needs a dash of theatrical flair.",
                url: "https://i.imgur.com/9c3H8Sl.png"
            },
            {
                id: 11,
                title: "Neon Gravity Defiance",
                caption: "Just a little midnight stretch on the neon pole!",
                url: "https://i.imgur.com/7GT282s.png"
            },
            {
                id: 12,
                title: "Mid-Air Magic",
                caption: "Practicing the elusive art of floating mid-air with style.",
                url: "https://i.imgur.com/LWRmZpQ.png"
            },
            {
                id: 13,
                title: "Sideways Hangout",
                caption: "Who needs the ground when you can just hang out sideways?",
                url: "https://i.imgur.com/TXgFmnC.png"
            },
            {
                id: 14,
                title: "Cozy Physics",
                caption: "Finding the coziest angle to defy physics.",
                url: "https://i.imgur.com/MjituWX.png"
            },
            {
                id: 15,
                title: "Stellar Chaos",
                caption: "Surrounded by stellar company and the best kind of chaos!",
                url: "https://i.imgur.com/Jq44k5R.png"
            },
            {
                id: 16,
                title: "Deep Thoughts",
                caption: "A close-up look at the deep thoughts behind the red and black locks.",
                url: "https://i.imgur.com/iJiibHd.png"
            },
            {
                id: 17,
                title: "Impromptu Seating",
                caption: "Just a casual day of hosting an impromptu seat for friends!",
                url: "https://i.imgur.com/L5CU7bl.png"
            },
            {
                id: 18,
                title: "Master of Multitasking",
                caption: "Holding down the couch and every creature in the room with absolute ease!",
                url: "https://i.imgur.com/LmF0bXt.png"
            },
            {
                id: 19,
                title: "Grimm's Playmate",
                caption: "The kitchen's official playmate keeping watch while everything floats in dreamland.",
                url: "https://i.imgur.com/mhtMCBV.png"
            },
            {
                id: 20,
                title: "The Legendary Cup",
                caption: "The artistic rendition of the legendary \"Grim's coom cup\" in full action!",
                url: "https://i.imgur.com/QbeBuE0.png"
            },
            {
                id: 21,
                title: "Midnight Pixels & Neon Fables",
                caption: "Step into a neon-lit dreamscape where anything can happen, pixel by pixel!",
                url: "https://i.imgur.com/ROKc7oe.png"
            }
        ];

        const galleryGrid = document.getElementById('galleryGrid');
        const photoModal = document.getElementById('photoModal');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalCaption = document.getElementById('modalCaption');
        const closeModal = document.getElementById('closeModal');

        // Render Photos in sequential order
        photos.forEach(photo => {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <div class="photo-frame">
                    <span class="photo-number">#${photo.id}</span>
                    <img src="${photo.url}" alt="${photo.title}" loading="lazy">
                </div>
                <div class="photo-info">
                    <div class="photo-title">${photo.title}</div>
                    <div class="photo-caption">${photo.caption}</div>
                </div>
            `;

            card.addEventListener('click', () => {
                modalImg.src = photo.url;
                modalTitle.textContent = `Relic #${photo.id}: ${photo.title}`;
                modalCaption.textContent = photo.caption;
                photoModal.classList.add('active');
            });

            galleryGrid.appendChild(card);
        });

        // Close Modal
        closeModal.addEventListener('click', () => {
            photoModal.classList.remove('active');
        });

        photoModal.addEventListener('click', (e) => {
            if (e.target === photoModal) {
                photoModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
